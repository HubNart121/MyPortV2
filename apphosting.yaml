# Firebase App Hosting runtime settings.
# NEXT_PUBLIC_FIREBASE_* values are configured in the App Hosting console so
# project-specific values are not committed to source control.
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: APP_ORIGIN
    value: "https://my-port-v2--myport-v2.asia-southeast1.hosted.app"
    availability:
      - RUNTIME
  - variable: ALLOWED_GOOGLE_EMAIL
    value: "sl@brt.co.th,asiametalnart@gmail.com,iphonenart@gmail.com"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_ALLOWED_GOOGLE_EMAIL
    value: "sl@brt.co.th,asiametalnart@gmail.com,iphonenart@gmail.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBF_Ig1_ox-6RObs4NnK_QU6GcXUxlJuyw
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: myport-v2.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: myport-v2
