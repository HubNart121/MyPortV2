version: '3.8'

services:
  db:
    image: ghcr.io/infrastructure-as-code/postgres:15-alpine
    container_name: clone-myport-db-dev
    environment:
      - POSTGRES_PASSWORD=postgres-root-password
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/db/01-init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      - ./docker/db/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/supabase/postgrest:v12.2.0
    container_name: clone-myport-api-dev
    environment:
      - PGRST_DB_URI=postgres://authenticator:my-secret-authenticator-password@db:5432/postgres
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=super-secret-jwt-key-with-at-least-32-characters
      - PGRST_DB_MAX_ROWS=50000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: clone-myport-gateway-dev
    ports:
      - "3011:8080"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  db-ui:
    image: ghcr.io/djnotes/adminer:latest
    container_name: clone-myport-db-ui-dev
    ports:
      - "8088:8080"
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: clone-myport-web-dev
    working_dir: /app
    ports:
      - "3010:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    extra_hosts:
      - "localhost:host-gateway"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
      - db
    restart: unless-stopped

volumes:
  postgres_data_dev:
