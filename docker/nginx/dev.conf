server {
    listen 8080;

    # Supabase JS client sends requests to /rest/v1/*
    # PostgREST expects requests at /*
    # This proxy rewrites the path to bridge the two
    location /rest/v1/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pass auth/health endpoints directly
    location / {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
